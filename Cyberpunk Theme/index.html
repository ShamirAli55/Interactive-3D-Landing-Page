<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPunk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="main w-full font-['Helvetica']">
    <nav class="w-full fixed top-[-10%] left-0 px-10 py-3 flex justify-between items-center">
      <img class="w-[200px] mix-blend-screen saturate-150 contrast-125"
      src="assets/images-removebg-preview.png" alt="">
      <div class="flex gap-5 items-center">
        <a href="#" class="tracking-tight text-white hover:text-cyan-400 transition-colors">Home</a>
        <a href="#" class="tracking-tight text-white hover:text-cyan-400 transition-colors">About</a>
        <a href="#" class="tracking-tight text-white hover:text-cyan-400 transition-colors">Services</a>
        <a href="#" class="tracking-tight text-white hover:text-cyan-400 transition-colors">Contact</a>
      </div>
    </nav>
    <div class="w-full h-screen overflow-hidden">
      <img class="h-[500px] w-1/2 absolute top-[30%] left-1/2  -translate-x-1/2 mix-blend-screen saturate-150 contrast-125"
       src="assets/images-removebg-preview.png" alt="">
       <div class="w-[50rem] h-[100rem] absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[-1] rounded-full bg-blue-800 blur-[100px]"></div>
      <canvas id="canvas"></canvas>
    </div>
    <div class="w-full h-screen bg-zinc-800"></div>
  </div>
   <script type="module" src="main.js"> </script>
</body>
</html>
